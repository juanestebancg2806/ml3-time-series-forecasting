[project]
name = "ml3-time-series-forecasting"
version = "0.1.0"
description = "Ejercicios de Aprendizaje Automático III (series de tiempo y pronósticos), Maestría en IA Aplicada, Universidad Icesi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
